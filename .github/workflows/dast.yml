# Platform-wide DAST against the deployed dev stack.
#   1. Authorization checks: does the platform stop cross-tenant and
#      anonymous access? (dast/authz/test_authz.py)
#   2. OWASP ZAP API scan of each service, driven by its OpenAPI spec.
#
# Runs on demand only (workflow_dispatch). Each service's own pipeline also runs ZAP
# right after it deploys (service-repo ci-cd.yml, job `dast`).
#
# Repository variables:
#   API_BASE_URL       https://<api-id>.execute-api.ap-southeast-1.amazonaws.com
#   VICTIM_STALL_ID    an existing stall ID to aim the tenant-isolation checks at
#   ZAP_FAIL           'true' to fail the run on ZAP FAIL-level alerts

name: DAST

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Override API base URL"
        required: false

permissions:
  contents: read

env:
  API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable

jobs:
  authz:
    name: Authorization checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r dast/authz/requirements.txt
      - name: Attack the deployed API
        env:
          VICTIM_STALL_ID: ${{ vars.VICTIM_STALL_ID || '1' }}
        run: |
          mkdir -p reports
          pytest dast/authz -v -rA --junitxml=reports/authz.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authz-report
          path: reports/

  zap:
    name: ZAP API scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [order, hawker, customer, analytics]
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          mkdir -p zap && cp dast/zap-rules.tsv zap/rules.tsv && chmod -R 777 zap
          target="$API_BASE_URL/${{ matrix.service }}"
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" zap-api-scan.py \
            -t "$target/openapi.json" -f openapi -O "$target" \
            -c rules.tsv \
            -r report.html -J report.json -w report.md \
            || code=$?
          echo "ZAP exit code: ${code:-0} (0 pass, 1 FAIL alerts, 2 WARN only, 3 error)"
          if [ "${{ vars.ZAP_FAIL }}" = "true" ] && [ "${code:-0}" = "1" ]; then exit 1; fi
          if [ "${code:-0}" = "3" ]; then exit 3; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-${{ matrix.service }}
          path: zap/
